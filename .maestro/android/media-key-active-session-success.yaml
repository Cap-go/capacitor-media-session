appId: app.capgo.media.session
---
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'e2ePrepareActiveMediaKeyBtn'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'e2ePrepareActiveMediaKeyBtn'
- extendedWaitUntil:
    visible: '.*M:media-key-active:prepared.*'
    timeout: 60000
- pressKey: Home
- pressKey: 'Remote Media Play Pause'
- runScript: scripts/media-play-pause-key.js
- assertTrue: ${output.mediaKeySent}
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'e2eVerifyActiveMediaKeyBtn'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'e2eVerifyActiveMediaKeyBtn'
- assertVisible: '.*M:media-key-active:success.*'