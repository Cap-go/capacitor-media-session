appId: app.capgo.media.session
---
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'e2e-prepare-active-media-key'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'e2e-prepare-active-media-key'
- extendedWaitUntil:
    visible: '.*M:media-key-active:prepared.*'
    timeout: 60000
- pressKey: Home
- runScript: adb shell input keyevent 85
- extendedWaitUntil:
    timeout: 20000
    visible: '.*'
- launchApp
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'e2e-verify-active-media-key'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'e2e-verify-active-media-key'
- assertVisible: '.*M:media-key-active:success.*'